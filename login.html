<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login SaneMap</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
display:flex;
align-items:center;
justify-content:center;

font-family:Poppins,sans-serif;

background:linear-gradient(135deg,#1a472a,#52b788);

}


.container{

background:#fff;

padding:40px;

width:400px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.25);

}


h1{

text-align:center;

color:#1a472a;

margin-bottom:25px;

}


input{

width:100%;

padding:12px;

margin-bottom:15px;

border-radius:10px;

border:2px solid #ddd;

font-size:16px;

outline:none;

}


input:focus{

border-color:#52b788;

}


button{

width:100%;

padding:12px;

border:0;

border-radius:25px;

background:#f4a261;

font-weight:bold;

font-size:16px;

cursor:pointer;

transition:.3s;

}


button:hover{

transform:translateY(-2px);

}


a{

display:block;

text-align:center;

margin-top:20px;

color:#2d6a4f;

text-decoration:none;

font-weight:bold;

}


</style>


</head>


<body>


<div class="container">


<h1>🌱 Login</h1>


<form onsubmit="login(event)">


<input

id="email"

type="email"

placeholder="Email"

required>


<input

id="senha"

type="password"

placeholder="Senha"

required>


<button type="submit">

Entrar

</button>


</form>


<a href="cadastro.html">

Criar conta

</a>


</div>



<script>


async function login(event){


event.preventDefault();



const email =

document.getElementById("email").value.trim();



const senha =

document.getElementById("senha").value;



try{


const resposta = await fetch(

"http://localhost:3000/login",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

email,

senha

})


}

);



const dados = await resposta.json();



console.log("Resposta login:", dados);



if(!resposta.ok){


alert(dados.mensagem || "Login inválido");

return;


}



// ======================
// SALVAR SESSÃO
// ======================


localStorage.setItem(

"token",

dados.token

);



localStorage.setItem(

"usuario",

JSON.stringify(dados.usuario)

);



localStorage.setItem(

"tipo",

dados.usuario.tipo

);




// ======================
// REDIRECIONAMENTO
// ======================


if(dados.usuario.tipo === "admin"){


window.location.href="admin.html";


}else{


window.location.href="ecoviva3.html";


}



}catch(erro){


console.log(erro);


alert("Erro ao conectar ao servidor.");


}



}



</script>



</body>

</html>
