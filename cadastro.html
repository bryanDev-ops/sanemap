<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro - SaneMap</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#1a472a,#52b788);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:#fff;
    width:400px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    color:#1a472a;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#52b788;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:25px;
    background:#f4a261;
    color:#1a472a;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

a{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2d6a4f;
    text-decoration:none;
    font-weight:bold;
}

a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

    <h1>🌱 Criar Conta</h1>

    <form onsubmit="cadastrar(event)">

        <input
            id="nome"
            type="text"
            placeholder="Nome"
            required>

        <input
            id="email"
            type="email"
            placeholder="E-mail"
            required>

        <input
            id="senha"
            type="password"
            placeholder="Senha"
            required>

        <button type="submit">
            Criar conta
        </button>

    </form>

    <a href="login.html">
        Já tenho conta
    </a>

</div>

<script>

async function cadastrar(event){

    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    if(!nome || !email || !senha){

        alert("Preencha todos os campos.");
        return;

    }

    try{

        const resposta = await fetch("http://localhost:3000/cadastro",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                nome,
                email,
                senha
            })

        });

        const dados = await resposta.json();

        alert(dados.mensagem);

        if(resposta.ok){

            window.location.href="login.html";

        }

    }catch(erro){

        console.log(erro);
        alert("Erro ao conectar com o servidor.");

    }

}

</script>

</body>
</html>
